<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Castle Escape</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/arcade.css">
<style>.arc-btns { gap: 8px; } .arc-btns .arc-round { width: 60px; height: 60px; }</style>
</head>
<body>
<script src="../../shared/arcade.js"></script>
<script src="../../shared/audio.js"></script>
<script src="../../shared/raycast.js"></script>
<script src="../../shared/fps.js"></script>
<script>
(function () {
  const T = Raycast.texture;
  const AU = Arcade.Audio;
  const S = '../../assets/sfx/';
  AU.load({
    music: '../../assets/audio/knight-deep.m4a', boss: '../../assets/audio/knight-dragon.m4a',
    shot: S + 'shot.wav', gun: S + 'gun.wav', punch: S + 'punch.wav', hit: S + 'hit.wav', scream: S + 'scream.wav', whoosh: S + 'whoosh.wav',
    coin: S + 'coin.wav', powerup: S + 'powerup.wav', fanfare: S + 'fanfare.wav', bump: S + 'bump.wav', growl: S + 'growl.wav', select: S + 'select.wav', boom: S + 'boom.wav', cue: S + 'cue.wav',
  });

  // ---------- wall textures ----------
  function stone(base, mortar, bw, bh, extra) {
    return T((c, w, h) => {
      c.fillStyle = mortar; c.fillRect(0, 0, w, h);
      let r = 11;
      for (let y = 0; y < h; y += bh) for (let x = -((y / bh) % 2) * bw / 2; x < w; x += bw) {
        r = (r * 9301 + 49297) % 233280; const v = r / 233280;
        c.fillStyle = base[Math.floor(v * base.length)]; c.fillRect(x + 1, y + 1, bw - 2, bh - 2);
        c.fillStyle = 'rgba(255,255,255,.08)'; c.fillRect(x + 1, y + 1, bw - 2, 1);
      }
      if (extra) extra(c, w, h);
    });
  }
  const TEX = [
    stone(['#8a8a8a', '#7a7a7a', '#929292', '#6e6e6e'], '#4a4a4a', 16, 8),                           // 0 grey stone
    stone(['#3a4a9a', '#34438c', '#4252a6', '#2e3c80'], '#1c2450', 32, 16),                          // 1 blue stone
    T((c, w, h) => { c.fillStyle = '#7a4a22'; c.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 16) { c.fillStyle = '#6a3e1a'; c.fillRect(x, 0, 2, h); c.fillStyle = '#8a5a2e'; c.fillRect(x + 3, 0, 1, h); } c.fillStyle = '#4a2a10'; c.fillRect(0, 30, w, 4); }), // 2 wood
    stone(['#9a3a2a', '#8a3222', '#a8442e', '#7a2c1e'], '#4a2a22', 16, 8),                           // 3 red brick
    stone(['#8a8a8a', '#7a7a7a', '#929292', '#6e6e6e'], '#4a4a4a', 16, 8, (c) => {                    // 4 banner
      c.fillStyle = '#8a1a1a'; c.fillRect(18, 4, 28, 50); c.fillStyle = '#ffd21e'; c.fillRect(18, 4, 28, 3); c.fillRect(18, 51, 28, 3);
      c.fillStyle = '#ffd21e'; c.beginPath(); c.moveTo(32, 16); c.lineTo(42, 22); c.lineTo(40, 36); c.lineTo(32, 44); c.lineTo(24, 36); c.lineTo(22, 22); c.fill();
      c.fillStyle = '#8a1a1a'; c.fillRect(30, 20, 4, 18); c.fillRect(26, 26, 12, 4);
    }),
    T((c, w, h) => { c.fillStyle = '#4a7a8a'; c.fillRect(0, 0, w, h); c.fillStyle = '#3a6272'; for (let y = 0; y < h; y += 8) c.fillRect(0, y, w, 1); c.fillStyle = '#9ab'; for (const y of [6, 58]) for (let x = 4; x < w; x += 8) c.fillRect(x, y, 2, 2); c.fillStyle = '#2a4a56'; c.fillRect(28, 26, 8, 12); }), // 5 door
    T((c, w, h) => { c.fillStyle = '#3a3a44'; c.fillRect(0, 0, w, h); c.fillStyle = '#555'; for (let y = 0; y < h; y += 16) c.fillRect(0, y, w, 2); }), // 6 jamb
    T((c, w, h) => { c.fillStyle = '#6a6a74'; c.fillRect(0, 0, w, h); c.fillStyle = '#4a4a54'; c.fillRect(4, 4, 56, 56); c.fillStyle = '#ffd21e'; c.fillRect(24, 18, 16, 28); c.fillStyle = '#e02828'; c.beginPath(); c.arc(32, 26, 5, 0, 7); c.fill(); c.fillStyle = '#28e048'; c.beginPath(); c.arc(32, 38, 5, 0, 7); c.fill(); c.fillStyle = '#fff'; c.font = '8px monospace'; c.fillText('EXIT', 21, 14); }), // 7 exit
    T((c, w, h) => { c.fillStyle = '#4a7a8a'; c.fillRect(0, 0, w, h); c.fillStyle = '#ffd21e'; c.fillRect(0, 28, w, 8); c.fillStyle = '#3a6272'; for (let y = 0; y < h; y += 8) c.fillRect(0, y, w, 1); }), // 8 gold door
    T((c, w, h) => { c.fillStyle = '#4a7a8a'; c.fillRect(0, 0, w, h); c.fillStyle = '#d8dce8'; c.fillRect(0, 28, w, 8); c.fillStyle = '#3a6272'; for (let y = 0; y < h; y += 8) c.fillRect(0, y, w, 1); }), // 9 silver door
    stone(['#5a6a4a', '#4e5e40', '#667656'], '#2e3626', 16, 8),                                        // 10 mossy
  ];

  // ---------- sprites ----------
  function soldier(uniform, trim, helmet, pose) {
    return T((c) => {
      const legs = pose === 'walk1' ? [-4, 4] : pose === 'walk2' ? [4, -4] : [0, 0];
      if (pose === 'dead') { c.fillStyle = '#6a1010'; c.fillRect(8, 56, 48, 5); c.fillStyle = uniform; c.fillRect(12, 52, 34, 8); c.fillStyle = helmet; c.fillRect(44, 50, 10, 8); c.fillStyle = '#ffb98a'; c.fillRect(46, 55, 6, 4); return; }
      const fall = pose === 'die1' ? 6 : pose === 'die2' ? 16 : 0;
      c.save(); if (fall) { c.translate(32, 64); c.rotate(fall / 30); c.translate(-32, -64 + fall); }
      c.fillStyle = '#222'; c.fillRect(22 + legs[0], 54, 8, 10); c.fillRect(34 + legs[1], 54, 8, 10);
      c.fillStyle = uniform; c.fillRect(23 + legs[0] / 2, 38, 7, 18); c.fillRect(34 + legs[1] / 2, 38, 7, 18);
      c.fillRect(20, 20, 24, 22); c.fillStyle = trim; c.fillRect(20, 36, 24, 3); c.fillRect(30, 20, 4, 16);
      c.fillStyle = '#ffb98a'; c.fillRect(27, 10, 10, 10);
      c.fillStyle = '#222'; c.fillRect(29, 13, 2, 2); c.fillRect(33, 13, 2, 2);
      c.fillStyle = helmet; c.fillRect(25, 6, 14, 6); c.fillRect(24, 10, 16, 2);
      c.fillStyle = uniform;
      if (pose === 'aim' || pose === 'shoot') { c.fillRect(24, 24, 16, 6); c.fillStyle = '#333'; c.fillRect(28, 22, 8, 12); if (pose === 'shoot') { c.fillStyle = '#ffe04a'; c.beginPath(); c.arc(32, 22, 6, 0, 7); c.fill(); } }
      else { c.fillRect(15, 22, 5, 16); c.fillRect(44, 22, 5, 16); c.fillStyle = '#333'; c.fillRect(44, 34, 4, 12); }
      if (pose === 'pain') { c.fillStyle = 'rgba(255,0,0,.5)'; c.fillRect(20, 20, 24, 22); }
      c.restore();
    });
  }
  const framesOf = (u, t, h) => ({ stand: soldier(u, t, h, 'stand'), walk1: soldier(u, t, h, 'walk1'), walk2: soldier(u, t, h, 'walk2'), aim: soldier(u, t, h, 'aim'), shoot: soldier(u, t, h, 'shoot'), pain: soldier(u, t, h, 'pain'), die1: soldier(u, t, h, 'die1'), die2: soldier(u, t, h, 'die2'), dead: soldier(u, t, h, 'dead') });
  function hound(pose) {
    return T((c) => {
      if (pose === 'dead') { c.fillStyle = '#6a1010'; c.fillRect(10, 58, 44, 4); c.fillStyle = '#7a5a3a'; c.fillRect(14, 52, 36, 8); return; }
      const j = pose === 'walk1' ? 3 : pose === 'walk2' ? -3 : 0;
      c.fillStyle = '#7a5a3a'; c.fillRect(14, 40, 36, 12); c.fillRect(16 + j, 50, 5, 12); c.fillRect(42 - j, 50, 5, 12); c.fillRect(22 - j, 50, 5, 12); c.fillRect(36 + j, 50, 5, 12);
      c.fillRect(40, 30, 16, 14); c.fillStyle = '#5a3e22'; c.fillRect(42, 26, 4, 6); c.fillRect(50, 26, 4, 6);
      c.fillStyle = '#222'; c.fillRect(52, 36, 4, 3); c.fillStyle = '#ff2020'; c.fillRect(46, 33, 2, 2);
      if (pose === 'aim' || pose === 'shoot') { c.fillStyle = '#fff'; c.fillRect(48, 42, 8, 2); }
      c.fillStyle = '#7a5a3a'; c.fillRect(8, 36, 8, 4);
    });
  }
  const DOG = { stand: hound('stand'), walk1: hound('walk1'), walk2: hound('walk2'), aim: hound('aim'), shoot: hound('shoot'), pain: hound('walk1'), die1: hound('walk2'), die2: hound('dead'), dead: hound('dead') };
  const item = fn => T(fn);
  const ITEMS = {
    food: item(c => { c.fillStyle = '#ddd'; c.beginPath(); c.ellipse(32, 54, 20, 6, 0, 0, 7); c.fill(); c.fillStyle = '#b8742a'; c.beginPath(); c.ellipse(32, 48, 12, 8, 0, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(42, 42, 6, 3); }),
    kit: item(c => { c.fillStyle = '#eee'; c.fillRect(18, 38, 28, 22); c.fillStyle = '#e02828'; c.fillRect(29, 41, 6, 16); c.fillRect(24, 46, 16, 6); }),
    clip: item(c => { c.fillStyle = '#333'; c.fillRect(24, 44, 16, 18); c.fillStyle = '#c8962a'; for (let k = 0; k < 4; k++) c.fillRect(26 + k * 3, 40, 2, 5); }),
    mg: item(c => { c.fillStyle = '#333'; c.fillRect(10, 48, 44, 8); c.fillRect(20, 54, 6, 8); c.fillStyle = '#6a4a2a'; c.fillRect(46, 48, 10, 10); }),
    cg: item(c => { c.fillStyle = '#444'; for (let k = 0; k < 4; k++) c.fillRect(8, 44 + k * 3, 40, 2); c.fillStyle = '#222'; c.fillRect(44, 42, 14, 16); }),
    gkey: item(c => { c.fillStyle = '#ffd21e'; c.beginPath(); c.arc(24, 50, 6, 0, 7); c.fill(); c.fillRect(28, 48, 20, 4); c.fillRect(42, 52, 3, 5); c.fillRect(46, 52, 3, 4); c.fillStyle = '#000'; c.beginPath(); c.arc(24, 50, 2, 0, 7); c.fill(); }),
    skey: item(c => { c.fillStyle = '#d8dce8'; c.beginPath(); c.arc(24, 50, 6, 0, 7); c.fill(); c.fillRect(28, 48, 20, 4); c.fillRect(42, 52, 3, 5); c.fillRect(46, 52, 3, 4); c.fillStyle = '#000'; c.beginPath(); c.arc(24, 50, 2, 0, 7); c.fill(); }),
    goblet: item(c => { c.fillStyle = '#ffd21e'; c.beginPath(); c.moveTo(22, 36); c.lineTo(42, 36); c.lineTo(36, 50); c.lineTo(28, 50); c.fill(); c.fillRect(30, 50, 4, 8); c.fillRect(24, 58, 16, 3); c.fillStyle = '#e02828'; c.fillRect(30, 40, 4, 4); }),
    crown: item(c => { c.fillStyle = '#ffd21e'; c.beginPath(); c.moveTo(18, 58); c.lineTo(18, 42); c.lineTo(25, 50); c.lineTo(32, 38); c.lineTo(39, 50); c.lineTo(46, 42); c.lineTo(46, 58); c.fill(); c.fillStyle = '#28a0e0'; c.fillRect(30, 50, 4, 4); c.fillStyle = '#e02828'; c.fillRect(21, 52, 3, 3); c.fillRect(40, 52, 3, 3); }),
    chest: item(c => { c.fillStyle = '#7a4a22'; c.fillRect(16, 42, 32, 20); c.fillStyle = '#ffd21e'; c.fillRect(16, 42, 32, 3); c.fillRect(30, 48, 4, 6); c.fillStyle = '#ffe07a'; c.fillRect(18, 38, 28, 4); }),
    life: item(c => { c.fillStyle = '#28a0e0'; c.beginPath(); c.arc(32, 46, 14, 0, 7); c.fill(); c.fillStyle = '#fff'; c.font = 'bold 14px monospace'; c.fillText('1UP', 20, 51); }),
    barrel: item(c => { c.fillStyle = '#5a3a1a'; c.fillRect(20, 26, 24, 38); c.fillStyle = '#3a2410'; c.fillRect(20, 32, 24, 3); c.fillRect(20, 54, 24, 3); }),
    pillar: item(c => { c.fillStyle = '#9a9a9a'; c.fillRect(24, 4, 16, 60); c.fillStyle = '#7a7a7a'; c.fillRect(34, 4, 6, 60); c.fillStyle = '#aaa'; c.fillRect(20, 0, 24, 6); c.fillRect(20, 58, 24, 6); }),
    lamp: item(c => { c.fillStyle = '#666'; c.fillRect(31, 0, 2, 8); c.fillStyle = '#ffe07a'; c.beginPath(); c.moveTo(24, 16); c.lineTo(40, 16); c.lineTo(36, 8); c.lineTo(28, 8); c.fill(); c.fillStyle = 'rgba(255,224,122,.35)'; c.beginPath(); c.arc(32, 18, 8, 0, 7); c.fill(); }),
    plant: item(c => { c.fillStyle = '#7a4a22'; c.fillRect(24, 48, 16, 14); c.fillStyle = '#2a8a3a'; for (let k = 0; k < 7; k++) { c.beginPath(); c.ellipse(32 + Math.cos(k) * 8, 36 + Math.sin(k * 2) * 6, 5, 10, k, 0, 7); c.fill(); } }),
    bones: item(c => { c.fillStyle = '#e8e4d0'; c.fillRect(16, 58, 30, 3); c.fillRect(20, 54, 3, 8); c.beginPath(); c.arc(44, 56, 5, 0, 7); c.fill(); c.fillStyle = '#000'; c.fillRect(42, 55, 2, 2); }),
    table: item(c => { c.fillStyle = '#7a4a22'; c.fillRect(8, 40, 48, 6); c.fillRect(12, 46, 4, 18); c.fillRect(48, 46, 4, 18); c.fillStyle = '#ddd'; c.fillRect(28, 36, 8, 4); }),
  };

  // ---------- weapons ----------
  function drawGun(c, w, flash, swing, x, y) {
    c.save(); c.translate(x, y);
    const kick = flash ? 4 : 0;
    if (w.name === 'KNIFE') {
      const s = swing > 0 ? Math.sin((0.25 - swing) / 0.25 * Math.PI) : 0;
      c.translate(20 - s * 30, -s * 20);
      c.fillStyle = '#ffb98a'; c.fillRect(-8, -30, 18, 30);
      c.fillStyle = '#5a3a1a'; c.fillRect(-4, -40, 10, 12);
      c.fillStyle = '#ddd'; c.beginPath(); c.moveTo(-2, -40); c.lineTo(1, -76); c.lineTo(5, -40); c.fill();
    } else {
      const long = w.name === 'PISTOL' ? 0 : 1;
      c.translate(0, kick);
      c.fillStyle = '#ffb98a'; c.fillRect(-10, -26, 20, 26);
      c.fillStyle = '#2a2a30'; c.fillRect(-7, -48 - long * 10, 14, 26 + long * 10);
      c.fillStyle = '#44444c'; c.fillRect(-4, -54 - long * 16, 8, 10);
      if (w.name === 'CHAIN GUN') { c.fillStyle = '#222'; for (let k = -2; k <= 2; k++) c.fillRect(k * 4 - 1, -74, 2, 22); }
      if (flash) { c.fillStyle = '#ffe04a'; c.beginPath(); c.arc(0, -60 - long * 16, 10, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -60 - long * 16, 4, 0, 7); c.fill(); }
    }
    c.restore();
  }

  // ---------- floors ----------
  const LEVELS = [
    { name: 'THE DUNGEON', floor: Raycast.hex('#5a5a5a'), ceil: Raycast.hex('#3a3a3a'), map: [
      '########################',
      '#>.....#......#........#',
      '#...l..#..g...#...t....#',
      '#......D......D.....o..#',
      '#..g...#..x...#..l.....#',
      '#......#......#..k.....#',
      '###D######D#############',
      '#......#......#........#',
      '#.a..f.#...l..#..g..t..#',
      '#......#......G.....x..#',
      '#..d...D..o...#..l.....E',
      '#......#......#...g....#',
      '#..t...#..h...#........#',
      '########################',
    ] },
    { name: 'THE BARRACKS', floor: Raycast.hex('#4a4030'), ceil: Raycast.hex('#2a2a3a'), map: [
      '########################',
      '#v..#.......*..........#',
      '#...D...g...D..o....t..#',
      '#...#.......*.........K#',
      '##D##...x...#####D######',
      'B...B.......#.......#..#',
      'B.a.B...l...#...d...P.c#',
      'B...BBD######.......#..#',
      'B.o...B.....#...l...#.t#',
      'B.....B..g..S.......####',
      'B..f..B.....#..g....#..#',
      'BBBDBBB.....#########..#',
      'W.......h...D.......D..E',
      'W..g....o...#..t..g.#..#',
      'WWWWWWWWWWWW############',
    ] },
    { name: "THE WARDEN'S KEEP", floor: Raycast.hex('#3a2a2a'), ceil: Raycast.hex('#1a1a22'), needBoss: true, music: 'boss', map: [
      'RRRRRRRRRRRRRRRRRRRRRRRR',
      'R^.R......R............R',
      'R..D..g...D...o....x...R',
      'R..R......R............R',
      'R..RRRDRRRR....l....o..R',
      'R......R..R............R',
      'R.a..f.R..RRRRRGRRRRRRRR',
      'R......D..R............R',
      'RRDRRRRR..R.....l......R',
      'R.......k.R............R',
      'R.o..g....R.....b......R',
      'R.........R.h..........R',
      'R..t..h...RRRRRERRRRRRRR',
      'RRRRRRRRRRRRRRRRRRRRRRRR',
    ] },
  ];

  const api = FPS.start({
    id: 'castle', title: 'CASTLE ESCAPE', subtitle: 'A TRIBUTE TO WOLFENSTEIN 3D (1992)', color: '#ffd21e',
    help: ['ARROWS MOVE AND TURN', 'SPACE FIRE   X OPEN DOORS', 'C + ARROWS TO STRAFE', '1-4 OR Q CHANGE WEAPON', 'FIND THE EXIT ON EACH FLOOR'],
    music: 'music', tex: TEX, jambTex: 6, exitTex: 7, levels: LEVELS,
    walls: { '#': 0, 'B': 1, 'W': 2, 'R': 3, '*': 4, 'E': 7, 'M': 10 },
    doors: { D: { tex: 5 }, G: { tex: 8, key: 'gold' }, S: { tex: 9, key: 'silver' } },
    enemies: {
      g: { name: 'GUARD', hp: 25, speed: 1.4, range: 9, rate: 1.4, dmg: [4, 16], points: 100, frames: framesOf('#6a6a4a', '#3a3a2a', '#4a4a3a'), drop: 'a', alert: 'growl', death: 'scream' },
      o: { name: 'OFFICER', hp: 50, speed: 2.0, range: 10, rate: 1.0, dmg: [6, 20], points: 400, frames: framesOf('#d8dce8', '#8a1a1a', '#3a3a44'), drop: 'a', aim: 0.25, death: 'scream' },
      d: { name: 'HOUND', hp: 12, speed: 3.2, range: 1.2, rate: 0.8, dmg: [4, 12], points: 200, frames: DOG, melee: true, sound: 'punch', death: 'growl', scale: 0.8 },
      b: { name: 'THE WARDEN', hp: 900, speed: 1.2, range: 12, rate: 0.35, dmg: [5, 15], points: 5000, frames: framesOf('#3a4a8a', '#ffd21e', '#222'), boss: true, burst: true, scale: 1.35, aim: 0.2 },
    },
    items: {
      f: { tex: ITEMS.food }, h: { tex: ITEMS.kit }, a: { tex: ITEMS.clip }, m: { tex: ITEMS.mg }, c: { tex: ITEMS.cg },
      k: { tex: ITEMS.gkey }, K: { tex: ITEMS.skey },
      t: { tex: ITEMS.goblet, treasure: 500 }, T: { tex: ITEMS.chest, treasure: 2500 }, n: { tex: ITEMS.crown, treasure: 5000 }, '1': { tex: ITEMS.life },
    },
    props: { x: { tex: ITEMS.barrel, solid: true }, i: { tex: ITEMS.pillar, solid: true, scale: 1 }, l: { tex: ITEMS.lamp, scale: 1 }, y: { tex: ITEMS.plant, solid: true }, z: { tex: ITEMS.bones }, q: { tex: ITEMS.table, solid: true } },
    startWeapons: 2, startAmmo: { bullets: 16 },
    weapons: [
      { name: 'KNIFE', melee: true, rate: 0.4, dmg: [10, 25], sound: 'whoosh', vol: 0.4 },
      { name: 'PISTOL', ammo: 'bullets', rate: 0.38, dmg: [12, 28], sound: 'shot' },
      { name: 'MACHINE GUN', ammo: 'bullets', rate: 0.13, dmg: [12, 28], sound: 'shot', auto: true, vol: 0.45 },
      { name: 'CHAIN GUN', ammo: 'bullets', rate: 0.07, dmg: [12, 28], sound: 'gun', auto: true, vol: 0.35 },
    ],
    pickup(it, p, api) {
      const G = api.G;
      switch (it.kind) {
        case 'f': if (p.health >= 100) return false; p.health = Math.min(100, p.health + 10); AU.play('coin', { v: 0.5 }); break;
        case 'h': if (p.health >= 100) return false; p.health = Math.min(100, p.health + 25); AU.play('powerup', { v: 0.5 }); break;
        case 'a': case 'drop': if (p.ammo.bullets >= 99) return false; p.ammo.bullets = Math.min(99, p.ammo.bullets + (it.kind === 'drop' ? 4 : 8)); AU.play('select', { v: 0.5 }); break;
        case 'm': p.owned[2] = true; G.weapon = Math.max(G.weapon, 2); p.ammo.bullets = Math.min(99, p.ammo.bullets + 6); AU.play('powerup', { v: 0.6 }); api.say('MACHINE GUN!'); break;
        case 'c': p.owned[3] = true; G.weapon = 3; p.ammo.bullets = Math.min(99, p.ammo.bullets + 6); AU.play('powerup', { v: 0.6 }); api.say('CHAIN GUN!'); break;
        case 'k': p.keys.gold = true; AU.play('powerup', { v: 0.6 }); api.say('GOLD KEY'); break;
        case 'K': p.keys.silver = true; AU.play('powerup', { v: 0.6 }); api.say('SILVER KEY'); break;
        case '1': p.lives++; p.health = 100; p.ammo.bullets = Math.min(99, p.ammo.bullets + 25); AU.play('powerup', { v: 0.8 }); api.say('EXTRA LIFE'); break;
        default: if (it.treasure) AU.play('coin', { v: 0.6 });
      }
    },
    drawWeapon: drawGun,
    drawBar(c, a, G, p, VIEW, W, H) {
      c.fillStyle = '#004a4a'; c.fillRect(0, VIEW, W, H - VIEW);
      c.fillStyle = '#003030'; c.fillRect(0, VIEW, W, 2);
      const box = (x, w, label, val, col) => { c.fillStyle = '#002222'; c.fillRect(x, VIEW + 6, w, 30); a.text(label, x + w / 2, VIEW + 8, 6, '#8cc', 'center'); a.text(String(val), x + w / 2, VIEW + 20, 10, col || '#fff', 'center'); };
      box(4, 40, 'FLOOR', G.level + 1);
      box(48, 76, 'SCORE', a.score);
      box(128, 34, 'LIVES', p.lives);
      // the face: gets more battered as health drops
      const fx = 166, fy = VIEW + 5;
      c.fillStyle = '#ffb98a'; c.fillRect(fx + 6, fy + 2, 22, 26); c.fillStyle = '#a0522d'; c.fillRect(fx + 5, fy, 24, 7);
      c.fillStyle = '#28a0e0'; c.fillRect(fx + 10, fy + 11, 4, 3); c.fillRect(fx + 20, fy + 11, 4, 3);
      const look = Math.floor(G.t) % 3 - 1; c.fillStyle = '#000'; c.fillRect(fx + 11 + look, fy + 12, 2, 2); c.fillRect(fx + 21 + look, fy + 12, 2, 2);
      c.fillStyle = '#8a3a2a'; c.fillRect(fx + 12, fy + 21, 10, 2);
      if (p.health < 60) { c.fillStyle = '#c02020'; c.fillRect(fx + 8, fy + 8, 3, 8); }
      if (p.health < 30) { c.fillStyle = '#c02020'; c.fillRect(fx + 22, fy + 16, 5, 7); c.fillRect(fx + 14, fy + 3, 3, 5); }
      box(202, 44, 'HEALTH', p.health + '%', p.health < 30 ? '#f55' : '#fff');
      box(250, 30, 'AMMO', p.ammo.bullets);
      c.fillStyle = '#002222'; c.fillRect(284, VIEW + 6, 32, 30);
      if (p.keys.gold) c.drawImage(keyIcon('#ffd21e'), 288, VIEW + 8);
      if (p.keys.silver) c.drawImage(keyIcon('#d8dce8'), 288, VIEW + 22);
    },
    winText: 'YOU ESCAPED THE CASTLE!',
  });
  const keyIcons = {};
  function keyIcon(col) { if (keyIcons[col]) return keyIcons[col]; const c = document.createElement('canvas'); c.width = 24; c.height = 12; const x = c.getContext('2d'); x.fillStyle = col; x.beginPath(); x.arc(5, 6, 4, 0, 7); x.fill(); x.fillRect(8, 5, 14, 3); x.fillRect(18, 8, 2, 3); return (keyIcons[col] = c); }
})();
