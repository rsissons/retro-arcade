<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maze Muncher</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/arcade.css">
</head>
<body>
<script src="../../shared/arcade.js"></script>
<script>
(function () {
  const W = 224, H = 288, T = 8, OY = 24;
  const MAZE = [
    '############################',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o####.#####.##.#####.####o#',
    '#.####.#####.##.#####.####.#',
    '#..........................#',
    '#.####.##.########.##.####.#',
    '#.####.##.########.##.####.#',
    '#......##....##....##......#',
    '######.##### ## #####.######',
    '     #.##### ## #####.#     ',
    '     #.##          ##.#     ',
    '     #.## ###--### ##.#     ',
    '######.## #      # ##.######',
    '      .   #      #   .      ',
    '######.## #      # ##.######',
    '     #.## ######## ##.#     ',
    '     #.##          ##.#     ',
    '     #.## ######## ##.#     ',
    '######.## ######## ##.######',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#.####.#####.##.#####.####.#',
    '#o..##.......  .......##..o#',
    '###.##.##.########.##.##.###',
    '###.##.##.########.##.##.###',
    '#......##....##....##......#',
    '#.##########.##.##########.#',
    '#.##########.##.##########.#',
    '#..........................#',
    '############################',
  ];
  const ROWS = MAZE.length, COLS = 28;
  const TUNNEL_ROW = 14;
  const DIRS = { up: [0, -1], left: [-1, 0], down: [0, 1], right: [1, 0] };
  const ORDER = ['up', 'left', 'down', 'right'];
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const BASE = 75.75;
  const FRIGHT = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];
  const FRUIT = [['cherry', 100], ['strawberry', 300], ['orange', 500], ['orange', 500], ['apple', 700], ['apple', 700], ['melon', 1000], ['melon', 1000], ['galaxian', 2000], ['galaxian', 2000], ['bell', 3000], ['bell', 3000], ['key', 5000]];
  const SCHED = [7, 20, 7, 20, 5, 20, 5, Infinity];
  const GHOSTS = [
    { name: 'blinky', color: '#f00', corner: [25, -3], home: [108, 116], house: false },
    { name: 'pinky', color: '#fbd', corner: [2, -3], home: [108, 140], house: true },
    { name: 'inky', color: '#0ff', corner: [27, 32], home: [92, 140], house: true },
    { name: 'clyde', color: '#fb5', corner: [0, 32], home: [124, 140], house: true },
  ];
  const DOOR_X = 108, OUT_Y = 116, IN_Y = 140;

  let G, A;
  const cell = (c, r) => {
    if (r === TUNNEL_ROW && (c < 0 || c >= COLS)) return ' ';
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return '#';
    return MAZE[r][c];
  };
  const isWall = (c, r) => { const ch = cell(c, r); return ch === '#' || ch === '-'; };
  const tileOf = (x, y) => [Math.floor(x / T), Math.floor((y - OY) / T)];
  const cx = c => c * T + 4, cy = r => r * T + 4 + OY;

  function speeds() {
    const l = G.level;
    if (l === 1) return { pac: .8, pacF: .9, ghost: .75, ghostF: .5, tun: .4 };
    if (l < 5) return { pac: .9, pacF: .95, ghost: .85, ghostF: .55, tun: .45 };
    return { pac: 1, pacF: 1, ghost: .95, ghostF: .6, tun: .5 };
  }

  // Move e along its direction, stopping at each tile centre to let choose() pick a new one.
  function advance(e, dist, choose) {
    let guard = 0;
    while (dist > 1e-6 && guard++ < 20) {
      const [c, r] = tileOf(e.x, e.y);
      const ccx = cx(c), ccy = cy(r);
      const atCenter = Math.abs(e.x - ccx) < 1e-4 && Math.abs(e.y - ccy) < 1e-4;
      if (atCenter) {
        e.x = ccx; e.y = ccy;
        choose(e, c, r);
        if (!e.dir || e.stopped) return;
      }
      const [dx, dy] = DIRS[e.dir];
      let toC = atCenter ? T : dx ? (ccx - e.x) * dx : (ccy - e.y) * dy;
      if (toC <= 1e-6) toC += T;
      const m = Math.min(dist, toC);
      e.x += dx * m; e.y += dy * m; dist -= m;
      if (e.x < -12) e.x += 240; else if (e.x > 236) e.x -= 240;
    }
  }

  function newLevelDots() {
    G.dots = MAZE.map(row => row.split('').map(ch => ch === '.' ? 1 : ch === 'o' ? 2 : 0));
    G.dotsLeft = G.dots.flat().filter(Boolean).length;
    G.eaten = 0;
    G.fruitShown = 0;
  }

  function resetActors() {
    G.pac = { x: 108, y: cy(23), dir: 'left', want: 'left', stopped: false, anim: 0 };
    G.ghosts = GHOSTS.map((d, i) => ({
      i, def: d, x: d.home[0], y: d.home[1], dir: i === 0 ? 'left' : i === 1 ? 'down' : 'up',
      state: d.house ? 'house' : 'active', fright: false, reverse: false, bob: 0,
    }));
    G.mode = 'scatter'; G.modeIdx = 0; G.modeT = SCHED[0];
    G.frightT = 0; G.eatChain = 0;
    G.ready = 2.2; G.releaseT = 0; G.houseDots = 0;
    G.fruit = null;
    G.pause = 0;
  }

  function startLevel() {
    G.level++;
    newLevelDots();
    resetActors();
  }

  function pacChoose(e, c, r) {
    if (e.want && e.want !== e.dir) {
      const [dx, dy] = DIRS[e.want];
      if (!isWall(c + dx, r + dy)) e.dir = e.want;
    }
    const [dx, dy] = DIRS[e.dir];
    e.stopped = isWall(c + dx, r + dy);
    // eat whatever is on this tile
    const d = G.dots[r] && G.dots[r][c];
    if (d) eatDot(c, r, d);
  }

  function eatDot(c, r, d) {
    G.dots[r][c] = 0;
    G.dotsLeft--; G.eaten++; G.houseDots++;
    G.lastDot = 0;
    if (d === 1) {
      A.addScore(10);
      G.waka = !G.waka;
      A.sfx.tone({ f: G.waka ? 420 : 300, f2: G.waka ? 300 : 420, d: 0.07, type: 'triangle', v: 0.12 });
    } else {
      A.addScore(50);
      const ft = FRIGHT[Math.min(G.level - 1, FRIGHT.length - 1)];
      G.eatChain = 0;
      for (const g of G.ghosts) {
        if (g.state === 'active') { g.reverse = true; }
        if (ft > 0 && (g.state === 'active' || g.state === 'house' || g.state === 'exit')) g.fright = true;
      }
      G.frightT = ft;
      A.sfx.tone({ f: 200, f2: 900, d: 0.3, type: 'sawtooth', v: 0.08 });
    }
    if (G.eaten === 70 || G.eaten === 170) {
      G.fruit = { t: 9.5, kind: FRUIT[Math.min(G.level - 1, FRUIT.length - 1)] };
    }
    if (G.dotsLeft === 0) { G.clear = 2.4; }
  }

  function ghostTarget(g) {
    const p = G.pac;
    const [pc, pr] = tileOf(p.x, p.y);
    const [pdx, pdy] = DIRS[p.dir];
    if (g.state === 'eyes') return [13, 11];
    if (G.mode === 'scatter' && !(g.i === 0 && G.dotsLeft < 20 + G.level * 2)) return g.def.corner;
    switch (g.def.name) {
      case 'blinky': return [pc, pr];
      case 'pinky': return [pc + pdx * 4, pr + pdy * 4];
      case 'inky': {
        const b = G.ghosts[0];
        const [bc, br] = tileOf(b.x, b.y);
        const ax = pc + pdx * 2, ay = pr + pdy * 2;
        return [ax * 2 - bc, ay * 2 - br];
      }
      case 'clyde': {
        const [gc, gr] = tileOf(g.x, g.y);
        return Math.hypot(gc - pc, gr - pr) > 8 ? [pc, pr] : g.def.corner;
      }
    }
  }

  function ghostChoose(g, c, r) {
    if (g.state === 'eyes' && c === 13 && r === 11) { g.state = 'enter'; g.x = DOOR_X; return; }
    if (g.reverse) { g.reverse = false; g.dir = OPP[g.dir]; return; }
    const opts = ORDER.filter(d => d !== OPP[g.dir] && !isWall(c + DIRS[d][0], r + DIRS[d][1]));
    if (!opts.length) { g.dir = OPP[g.dir]; return; }
    if (g.fright && g.state === 'active') { g.dir = A.pick(opts); return; }
    const [tx, ty] = ghostTarget(g);
    let best = null, bd = Infinity;
    for (const d of opts) {
      const nx = c + DIRS[d][0], ny = r + DIRS[d][1];
      const dd = (nx - tx) ** 2 + (ny - ty) ** 2;
      if (dd < bd) { bd = dd; best = d; }
    }
    g.dir = best;
  }

  function moveGhost(g, dt) {
    const s = speeds();
    const [c, r] = tileOf(g.x, g.y);
    if (g.state === 'house') {
      g.bob += dt * 6;
      g.y = g.def.home[1] + Math.sin(g.bob) * 3;
      return;
    }
    if (g.state === 'exit') {
      const v = BASE * 0.5 * dt;
      if (Math.abs(g.x - DOOR_X) > v) g.x += Math.sign(DOOR_X - g.x) * v;
      else {
        g.x = DOOR_X;
        if (g.y - OUT_Y > v) g.y -= v;
        else { g.y = OUT_Y; g.state = 'active'; g.dir = 'left'; }
      }
      return;
    }
    if (g.state === 'enter') {
      const v = BASE * 1.6 * dt;
      if (IN_Y - g.y > v) g.y += v;
      else { g.y = IN_Y; g.state = 'exit'; g.fright = false; }
      return;
    }
    let sp;
    if (g.state === 'eyes') sp = 1.6;
    else if (r === TUNNEL_ROW && (c < 6 || c > 21)) sp = s.tun;
    else if (g.fright) sp = s.ghostF;
    else if (g.i === 0 && G.dotsLeft < 20 + G.level * 2) sp = s.ghost + 0.05;
    else sp = s.ghost;
    advance(g, BASE * sp * dt, ghostChoose);
  }

  function die() {
    G.dying = 0.001;
    A.sfx.tune([[784, .12], [740, .12], [698, .12], [659, .12], [622, .12], [587, .12], [554, .12], [523, .2], [0, .1], [262, .1], [262, .1]], { v: .1, type: 'triangle' });
  }

  A = Arcade.start({
    id: 'muncher', title: 'MAZE MUNCHER', subtitle: 'A TRIBUTE TO PAC-MAN (1980)', color: '#ff0',
    width: W, height: H,
    help: ['ARROWS STEER', '', 'EAT EVERY DOT', 'POWER PELLETS TURN', 'THE GHOSTS BLUE'],
    touch: { dpad: '4', buttons: [] },
    newGame(a) {
      G = { level: 0, lives: 3, extra: false, t: 0 };
      startLevel();
      a.sfx.tune([[523, .15], [659, .15], [784, .15], [659, .15], [698, .15], [880, .15], [784, .3], [659, .15], [784, .15], [1047, .45]], { v: .08 });
    },
    update(a, dt) {
      G.t += dt;
      const p = G.pac;
      for (const d of ORDER) if (a.down(d)) p.want = d;
      if (G.ready > 0) { G.ready -= dt; return; }
      if (G.pause > 0) { G.pause -= dt; return; }
      if (G.clear > 0) {
        G.clear -= dt;
        if (G.clear <= 0) { G.clear = 0; startLevel(); }
        return;
      }
      if (G.dying) {
        G.dying += dt;
        if (G.dying > 2.6) {
          G.dying = 0;
          G.lives--;
          if (G.lives <= 0) { a.gameOver(); return; }
          resetActors();
        }
        return;
      }
      const s = speeds();
      // pac
      if (p.want === OPP[p.dir]) { p.dir = p.want; p.stopped = false; }
      if (p.stopped && p.want !== p.dir) {
        const [c, r] = tileOf(p.x, p.y);
        const [dx, dy] = DIRS[p.want];
        if (!isWall(c + dx, r + dy)) { p.dir = p.want; p.stopped = false; }
      }
      if (!p.stopped) {
        const before = p.x + p.y;
        advance(p, BASE * (G.frightT > 0 ? s.pacF : s.pac) * dt, pacChoose);
        p.anim += Math.abs(p.x + p.y - before);
      }

      // modes
      if (G.frightT > 0) {
        G.frightT -= dt;
        if (G.frightT <= 0) { for (const g of G.ghosts) g.fright = false; }
        if (Math.floor(G.t * 4) !== Math.floor((G.t - dt) * 4)) a.sfx.tone({ f: 180, f2: 360, d: 0.12, type: 'sine', v: 0.05 });
      } else {
        G.modeT -= dt;
        if (G.modeT <= 0) {
          G.modeIdx++;
          G.mode = G.modeIdx % 2 ? 'chase' : 'scatter';
          G.modeT = SCHED[Math.min(G.modeIdx, SCHED.length - 1)];
          for (const g of G.ghosts) if (g.state === 'active') g.reverse = true;
        }
        if (Math.floor(G.t * 3) !== Math.floor((G.t - dt) * 3)) {
          G.siren = !G.siren;
          a.sfx.tone({ f: G.siren ? 380 : 520, f2: G.siren ? 520 : 380, d: 0.33, type: 'sine', v: 0.025 });
        }
      }

      // ghost release
      G.releaseT += dt; G.lastDot = (G.lastDot || 0) + dt;
      const waiting = G.ghosts.filter(g => g.state === 'house');
      if (waiting.length) {
        const g = waiting[0];
        const need = [0, 0, 30, 60][g.i];
        if (G.houseDots >= need || G.lastDot > 4) { g.state = 'exit'; G.lastDot = 0; }
      }
      for (const g of G.ghosts) moveGhost(g, dt);

      // collisions
      for (const g of G.ghosts) {
        if (g.state !== 'active') continue;
        if (Math.abs(g.x - p.x) < 6 && Math.abs(g.y - p.y) < 6) {
          if (g.fright) {
            g.fright = false; g.state = 'eyes';
            const pts = 200 * Math.pow(2, G.eatChain++);
            a.addScore(pts);
            G.popup = { x: g.x, y: g.y, s: String(pts), t: 1 };
            G.pause = 0.8;
            a.sfx.tone({ f: 200, f2: 1600, d: 0.4, type: 'square', v: 0.08 });
          } else { die(); return; }
        }
      }
      // fruit
      if (G.fruit) {
        G.fruit.t -= dt;
        if (G.fruit.t <= 0) G.fruit = null;
        else if (Math.abs(p.x - 108) < 6 && Math.abs(p.y - cy(17)) < 6) {
          a.addScore(G.fruit.kind[1]);
          G.popup = { x: 108, y: cy(17), s: String(G.fruit.kind[1]), t: 1.5 };
          G.fruit = null;
          a.sfx.tune([[880, .06], [1175, .06], [1568, .1]], { v: .1 });
        }
      }
      if (G.popup) { G.popup.t -= dt; if (G.popup.t <= 0) G.popup = null; }
      if (!G.extra && a.score >= 10000) { G.extra = true; G.lives++; a.sfx.tune([[1047, .1], [1319, .1], [1568, .2]], { v: .1 }); }
    },
    draw(a) {
      const c = a.ctx;
      const flash = G.clear > 0 && G.clear < 2 && Math.floor(G.clear * 5) % 2 === 0;
      c.drawImage(flash ? mazeFlash : mazeImg, 0, 0, W, H);
      // dots
      c.fillStyle = '#fca';
      for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
        const d = G.dots[r][col];
        if (d === 1) c.fillRect(cx(col) - 1, cy(r) - 1, 2, 2);
        else if (d === 2 && Math.floor(G.t * 5) % 2 === 0 || d === 2 && G.ready > 0) { c.beginPath(); c.arc(cx(col), cy(r), 3.5, 0, 7); c.fill(); }
      }
      if (G.fruit) drawFruit(c, G.fruit.kind[0], 108, cy(17));
      // ghosts
      if (!G.dying || G.dying < 1) {
        for (const g of G.ghosts) {
          if (G.pause > 0 && G.popup && Math.abs(g.x - G.popup.x) < 1 && Math.abs(g.y - G.popup.y) < 1) continue;
          drawGhost(c, g);
        }
      }
      // pac
      const p = G.pac;
      if (G.pause > 0 && G.popup) { /* pac hidden while score shows, like the original */ }
      else if (G.dying) drawDeath(c, p, G.dying);
      else drawPac(c, p);
      if (G.popup) a.text(G.popup.s, G.popup.x, G.popup.y - 3, 6, '#0ff', 'center');
      // HUD
      a.text('1UP', 24, 0, 8, '#fff');
      a.text(String(a.score).padStart(2, '0'), 56, 9, 8, '#fff', 'right');
      a.text('HIGH SCORE', W / 2, 0, 8, '#fff', 'center');
      a.text(String(a.hi), W / 2 + 20, 9, 8, '#fff', 'right');
      for (let i = 0; i < Math.min(G.lives - 1, 5); i++) drawPac(c, { x: 20 + i * 16, y: H - 8, dir: 'left', anim: 6 }, 6.5);
      for (let i = Math.max(0, G.level - 7), k = 0; i < G.level; i++, k++) drawFruit(c, FRUIT[Math.min(i, FRUIT.length - 1)][0], W - 16 - k * 16, H - 8);
      if (G.ready > 0) a.text('READY!', W / 2, cy(17) - 4, 8, '#ff0', 'center');
    },
  });

  // ---------- drawing ----------
  const mazeImg = renderMaze('#2121de');
  const mazeFlash = renderMaze('#fff');
  function renderMaze(col) {
    const cv = document.createElement('canvas');
    cv.width = W * 3; cv.height = H * 3;
    const c = cv.getContext('2d');
    c.scale(3, 3);
    c.strokeStyle = col; c.lineWidth = 1.2; c.lineCap = 'round';
    const wall = (x, y) => { const ch = cell(x, y); return ch === '#'; };
    const I = 2.5;
    c.beginPath();
    for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) {
      if (!wall(q, r)) continue;
      const x = q * T, y = r * T + OY;
      const up = wall(q, r - 1), dn = wall(q, r + 1), lf = wall(q - 1, r), rt = wall(q + 1, r);
      if (!up) { c.moveTo(x + (lf ? 0 : I), y + I); c.lineTo(x + T - (rt ? 0 : I), y + I); }
      if (!dn) { c.moveTo(x + (lf ? 0 : I), y + T - I); c.lineTo(x + T - (rt ? 0 : I), y + T - I); }
      if (!lf) { c.moveTo(x + I, y + (up ? 0 : I)); c.lineTo(x + I, y + T - (dn ? 0 : I)); }
      if (!rt) { c.moveTo(x + T - I, y + (up ? 0 : I)); c.lineTo(x + T - I, y + T - (dn ? 0 : I)); }
      // inner corners
      if (up && lf && !wall(q - 1, r - 1)) { c.moveTo(x, y + I); c.lineTo(x + I, y + I); c.lineTo(x + I, y); }
      if (up && rt && !wall(q + 1, r - 1)) { c.moveTo(x + T, y + I); c.lineTo(x + T - I, y + I); c.lineTo(x + T - I, y); }
      if (dn && lf && !wall(q - 1, r + 1)) { c.moveTo(x, y + T - I); c.lineTo(x + I, y + T - I); c.lineTo(x + I, y + T); }
      if (dn && rt && !wall(q + 1, r + 1)) { c.moveTo(x + T, y + T - I); c.lineTo(x + T - I, y + T - I); c.lineTo(x + T - I, y + T); }
    }
    c.stroke();
    c.fillStyle = '#fbd';
    c.fillRect(13 * T, 12 * T + OY + 3, 16, 2);
    return cv;
  }

  function drawPac(c, p, rad) {
    rad = rad || 6.5;
    const open = (Math.sin(p.anim * 0.8) + 1) / 2 * 0.8 + 0.05;
    const base = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[p.dir];
    c.fillStyle = '#ff0';
    c.beginPath();
    c.moveTo(p.x, p.y);
    c.arc(p.x, p.y, rad, base + open, base + Math.PI * 2 - open);
    c.closePath(); c.fill();
  }
  function drawDeath(c, p, t) {
    if (t < 1) { drawPac(c, { x: p.x, y: p.y, dir: 'up', anim: 2 }); return; }
    const k = Math.min(1, (t - 1) / 1.3);
    if (k >= 1) return;
    const open = 0.1 + k * Math.PI;
    c.fillStyle = '#ff0';
    c.beginPath(); c.moveTo(p.x, p.y);
    c.arc(p.x, p.y, 6.5, -Math.PI / 2 + open, -Math.PI / 2 + Math.PI * 2 - open);
    c.closePath(); c.fill();
  }
  function drawGhost(c, g) {
    const x = g.x, y = g.y;
    const flashing = G.frightT < 2 && Math.floor(G.t * 5) % 2 === 0;
    const eyesOnly = g.state === 'eyes' || g.state === 'enter';
    if (!eyesOnly) {
      c.fillStyle = g.fright ? (flashing ? '#fff' : '#22f') : g.def.color;
      c.beginPath();
      c.arc(x, y - 1, 6.5, Math.PI, 0);
      c.lineTo(x + 6.5, y + 6);
      const wig = Math.floor(G.t * 8) % 2;
      for (let i = 0; i < 4; i++) {
        const bx = x + 6.5 - (i + 1) * 3.25;
        c.lineTo(bx + 1.6, y + (i % 2 === wig ? 3.5 : 6.5));
        c.lineTo(bx, y + 6);
      }
      c.closePath(); c.fill();
    }
    if (g.fright && !eyesOnly) {
      c.fillStyle = flashing ? '#f00' : '#fca';
      c.fillRect(x - 3, y - 2, 2, 2); c.fillRect(x + 1, y - 2, 2, 2);
      c.fillRect(x - 4, y + 3, 1, 1); c.fillRect(x - 2, y + 2, 1, 1); c.fillRect(x, y + 3, 1, 1); c.fillRect(x + 2, y + 2, 1, 1); c.fillRect(x + 4, y + 3, 1, 1);
      return;
    }
    const [dx, dy] = DIRS[g.dir] || [0, 0];
    c.fillStyle = '#fff';
    for (const ex of [-2.8, 2.8]) { c.beginPath(); c.ellipse(x + ex + dx, y - 2 + dy, 2.2, 2.8, 0, 0, 7); c.fill(); }
    c.fillStyle = '#22f';
